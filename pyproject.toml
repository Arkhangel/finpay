[project]
name = "finpay"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "requests>=2.31",
    "jsonschema>=4.0",
    "pyyaml>=6.0.3",
    "litellm[proxy]>=1.87.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "redis[asyncio]>=5.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.0",
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-openai>=0.1",
    "aiofiles>=25.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "tiktoken>=0.13.0",
    "aiogram>=3.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "diskcache>=5.6.3",
    "sentence-transformers>=5.6.0",
    "qdrant-client>=1.18.0",
    "llama-index>=0.14.23",
    "llama-index-vector-stores-qdrant>=0.10.2",
    "llama-index-readers-file>=0.6.0",
    "llama-index-embeddings-huggingface>=0.7.0",
    "docx2txt>=0.9",
    "llama-index-llms-openai-like>=0.7.2",
    "pymupdf>=1.28.0",
]

[dependency-groups]
dev = [
    "garak>=0.15.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "reportlab>=5.0.0",
    "testcontainers[postgresql]>=4.14.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "llm: tests that require a real LLM API call (deselect with -m 'not llm')",
]
