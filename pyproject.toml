[project]
name = "finpay"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "requests>=2.31",
    "jsonschema>=4.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "redis[asyncio]>=5.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.0",
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-openai>=0.1",
    "aiofiles>=25.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "tiktoken>=0.13.0",
    "aiogram>=3.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "diskcache>=5.6.3",
    "sentence-transformers>=5.6.0",
    "qdrant-client>=1.18.0",
    "llama-index>=0.14.23",
    "llama-index-vector-stores-qdrant>=0.10.2",
    "llama-index-readers-file>=0.6.0",
    "llama-index-embeddings-huggingface>=0.7.0",
    "docx2txt>=0.9",
    "llama-index-llms-openai-like>=0.7.2",
    "pymupdf>=1.28.0",
    # Блок 6.3: ReAct-агент из agent_react.py (Б6.2) переносится на LangGraph.
    # 1.x — API кардинально другой относительно 0.x (create_react_agent
    # deprecated в пользу langchain.agents.create_agent), смешивать нельзя.
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0",
    "langchain-core>=1.0",
    # Блок 6.4: персистентность (checkpointer) + HIL для agent_persistent.py.
    # aiosqlite обязателен явно — без него AsyncSqliteSaver молча не
    # импортируется. Для AsyncPostgresSaver нужен psycopg v3, не psycopg2.
    "langgraph-checkpoint-sqlite>=2.1",
    "langgraph-checkpoint-postgres>=2.1",
    "aiosqlite>=0.20",
    "psycopg[binary,pool]>=3.2",
    # Блок 6.5: supervisor-граф researcher+writer в experiments/.
    "langgraph-supervisor>=0.0.31",
]

[project.optional-dependencies]
# Eval-time зависимости (блок 5.6) — не нужны в проде, ставятся по требованию:
# uv sync --extra eval --extra tracing
eval = [
    "ragas>=0.4,<0.5",
    # RAGAS 0.4 тянет langchain-community в ядре; в свежих 0.4.x путь импорта
    # ломается без пина (import ragas падает на
    # langchain_community.chat_models.vertexai).
    "langchain-community<0.4",
    "pandas>=2",
    # <14: arize-phoenix>=17 импортирует MCPServerStreamableHTTP из
    # pydantic_ai.mcp, которого нет в pydantic-ai-slim 2.25 (актуальная
    # версия, тянется другими зависимостями проекта) — ImportError при
    # первом импорте phoenix.session.session (проверено вживую, Б6.3).
    "arize-phoenix>=5,<14",
    "arize-phoenix-evals<3",
    "rapidfuzz>=3.14.5",
]
tracing = [
    # >=4 обязателен с llama-index-core 0.14.x: 3.x импортирует
    # llama_index.core.base.agent.types (BaseAgent/BaseAgentWorker), которого
    # в 0.14 уже нет — ModuleNotFoundError при instrument() (проверено вживую).
    "openinference-instrumentation-llama-index>=4,<5",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]

[dependency-groups]
dev = [
    "garak>=0.15.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "reportlab>=5.0.0",
    "testcontainers[postgresql]>=4.14.2",
]

[tool.uv]
# garak (dev) пинит datasets<4.0, ragas>=0.4 (eval) требует datasets>=4.0 —
# несовместимы в одном универсальном резолве, но никогда не ставятся вместе
# (garak — security-сканы, ragas — офлайн eval-прогоны). Помечаем конфликт
# явно, чтобы uv резолвил их раздельными форками лока, а не считал проект
# неразрешимым.
conflicts = [
    [
        { group = "dev" },
        { extra = "eval" },
    ],
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "llm: tests that require a real LLM API call (deselect with -m 'not llm')",
]
