services:
  app:
    build: .
    image: finpay-service:v1
    command: ["sh", "-c", "alembic upgrade head && python main.py rest"]
    ports:
      - "8000:8000"
    environment:
      OPENAI__API_KEY: ${OPENAI__API_KEY}
      OPENAI__HOST: ${OPENAI__HOST:-https://api.groq.com/openai/v1}
      OPENAI__MODEL: ${OPENAI__MODEL:-llama-3.1-8b-instant}
      REDIS__URL: redis://redis:6379/0
      CHAT__REPOSITORY: postgres
      CHAT__DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finpay
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      BOT__BOT_URL: http://bot:9000
      BOT__INTERNAL_TOKEN: ${BOT__INTERNAL_TOKEN}
      HOST: 0.0.0.0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
      QDRANT__URL: http://qdrant:6333
      QDRANT__API_KEY: ${QDRANT_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      phoenix:
        condition: service_started
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  bot:
    build: .
    image: finpay-service:v1
    command: ["python", "main.py", "bot"]
    ports:
      - "9000:9000"
    environment:
      BOT__TOKEN: ${BOT__TOKEN}
      BOT__BACKEND_URL: http://app:8000
      BOT__BOT_URL: http://bot:9000
      BOT__INTERNAL_TOKEN: ${BOT__INTERNAL_TOKEN}
      BOT__BOT_API_PORT: 9000
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      OPENAI__API_KEY: ${OPENAI__API_KEY}
      OPENAI__HOST: ${OPENAI__HOST:-https://api.groq.com/openai/v1}
      OPENAI__MODEL: ${OPENAI__MODEL:-llama-3.1-8b-instant}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finpay
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:v1.14.0
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped

volumes:
  redis_data: {}
  phoenix-data: {}
  pg_data: {}
  qdrant_storage: {}
