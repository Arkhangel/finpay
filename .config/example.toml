project_name = "FinPay"
cors_origins = ["http://localhost:3000"]

host = "127.0.0.1"
port = 8000
workers = 1
reload = true

security_enabled = true
admin_token = ""                  # секрет для /chats/admin/* (заголовок X-Admin-Token), задавать через ADMIN_TOKEN

[openai]
api_key = ""
host = "https://api.groq.com/openai/v1"
# openai/gpt-oss-120b — Groq депрекировал llama-3.1-8b-instant и
# llama-3.3-70b-versatile на free/developer-tier (2026-07-25).
model = "openai/gpt-oss-120b"
whisper_model = "whisper-1"       # STT-модель для голосовых сообщений (см. app/chat/media.py)

[embeddings]
model = "intfloat/multilingual-e5-base"  # self-hosted, скачивается с HuggingFace при первом использовании
device = "cpu"
batch_size = 32                          # 16-32 рекомендуется для sentence-transformers на CPU
cache_dir = ".cache/embeddings"
dim = 768                                # размерность вектора intfloat/multilingual-e5-base

[qdrant]
url = "http://localhost:6333"
api_key = ""                             # секрет Qdrant REST/gRPC API, задавать через QDRANT__API_KEY
collection = "documents"

[rag]
# rag_block_03 — исторический корпус Б5.3/Б5.4 (10 документов), отдельная
# коллекция от продакшен-базы, см. kb_collection ниже. Не смешивать.
corpus_dir = "data/rag-block-03"
collection = "rag_block_03"
collection_baremetal = "rag_block_03_baremetal"

# Б5.5: полный корпоративный корпус (data/<category>/...), продакшен-коллекция.
kb_collection = "finpay_kb"
docstore_path = "storage/docstore_kb.json"   # SimpleDocumentStore для DocstoreStrategy.UPSERTS

chunk_size = 512                             # baseline fixed/recursive-чанкинга (app/services/chunking.py)
chunk_overlap = 64
chunking_strategy = "semantic"               # "semantic" победил в Б5.4 (docs/chunking_experiment.md)
semantic_buffer_size = 1
semantic_breakpoint_percentile_threshold = 95

similarity_top_k = 10                        # top-K из retrieval до re-ranking
reranker_enabled = true                      # BAAI/bge-reranker-v2-m3, см. app/services/reranker.py
reranker_candidate_k = 20
rerank_top_n = 5                             # top-N после re-ranking, идёт в контекст LLM

# Порог "не найдено" — сравнивается с score ПОСЛЕ re-ranking (сырой score
# cross-encoder, не косинус — несопоставимая шкала с классическим similarity).
# 0.005 — калибровка на finpay_kb (172 документа), подробности и честный
# разбор ограничений — docs/rag.md, раздел "Threshold для отказа".
score_threshold = 0.005

[redis]
url = "redis://localhost:6379"
password = ""
ttl = 3600

[bot]
token = ""                        # Telegram bot token from @BotFather
backend_url = "http://localhost:8000"
admin_ids = []                            # Telegram user_id с доступом к /stats, /users, /broadcast
bot_url = "http://localhost:9000"        # backend -> bot: базовый URL для POST /notify
internal_token = ""                      # общий секрет для /notify, задавать через BOT__INTERNAL_TOKEN, в репозиторий не коммитить
bot_api_port = 9000                       # порт, на котором бот поднимает свой внутренний FastAPI (/notify)

[chat]
repository = "json"           # "json" | "postgres"
storage_dir = "./var"
context_strategy = "sliding"  # "sliding" | "hybrid"
context_window = 10
database_url = "postgresql+asyncpg://postgres:postgres@localhost:5432/finpay"
rag_condense_enabled = true    # Б5.5: переписывает follow-up ("а для них?") в самостоятельный вопрос для retrieval

[moderation]
enabled = true                                          # false — полностью отключить модерацию
use_openai_api = false                                  # true — включить второй слой (omni-moderation-latest)
keywords_path = "app/moderation/moderation_keywords.yaml"

# Кастомные пороги score (0..1) по категориям omni-moderation; категории без
# явного порога используют дефолт 0.5 (см. app/moderation/service.py).
# [moderation.category_thresholds]
# violence = 0.3
# self_harm = 0.2

[eval]
# Б5.6: судья RAGAS-метрик + LLM для генерации golden dataset — намеренно
# другая модель, чем продакшен (openai.model выше), чтобы не путать роли.
# Тот же Groq-провайдер, без Anthropic/OpenAI ключей (см. docs/rag_evaluation.md).
# qwen/qwen3.6-27b не подошла — не проходит structured output (Instructor
# Mode.JSON), который требуют RAGAS metrics.collections; gpt-oss-20b (младший
# брат продакшен-модели, другие веса) работает стабильно.
judge_model = "openai/gpt-oss-20b"
golden_dataset_path = "tests/eval/golden_dataset.json"
results_dir = "tests/eval/results"

# scripts/generate_testset.py — разовая генерация golden dataset, настоящий
# OpenAI (не Groq): TestsetGenerator делает много LLM-вызовов на knowledge
# graph, на free tier Groq это часы (см. docs/rag_evaluation.md).
testset_llm_api_key = ""
testset_llm_model = "gpt-5.4-mini"
